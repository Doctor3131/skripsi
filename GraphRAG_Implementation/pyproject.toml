[project]
name = "fsm-process-graphrag"
version = "0.1.0"
description = "Exploratory process-aware GraphRAG feasibility project for FSM Undip SOPs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "neo4j==6.4.1",
    "neo4j-graphrag[openai]==1.22.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsm_graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
